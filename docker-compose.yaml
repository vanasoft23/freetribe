services:
  freetribe:
    platform: linux/amd64
    image: bangcorrupt/freetribe
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    hostname: ft
    stdin_open: true
    tty: true

    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined

    volumes:
      - ./:/freetribe
